# PRODUCTION: frontend on the Pi cluster.
#   Deployed by Argo CD from deploy/k8s (kustomization.yaml sets the image tag).
#
# nginx serving the chat page and forwarding /api/* to api-gateway. The only Service reachable
# from outside the cluster. Open it through the master VM's IP: http://<master-ip>:30080.
# A NodePort answers on every node, so that address survives any Pi being pulled; a Pi's own
# IP does not. Same layout as vector-db.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels: {app: frontend}
spec:
  replicas: 1
  selector:
    matchLabels: {app: frontend}
  template:
    metadata:
      labels: {app: frontend}
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels: {app: frontend}
      tolerations:
        - {key: node.kubernetes.io/unreachable, operator: Exists, effect: NoExecute, tolerationSeconds: 20}
        - {key: node.kubernetes.io/not-ready, operator: Exists, effect: NoExecute, tolerationSeconds: 20}
      containers:
        - name: frontend
          image: ghcr.io/ballboii/khunlook-frontend:latest   # tag set by deploy/k8s/kustomization.yaml
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8080}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}
          startupProbe:                    # up to ~30 s, like the other services: a Pi taking over
            httpGet: {path: /healthz, port: http}   # several pods at once after a failover can be slow
            periodSeconds: 2
            failureThreshold: 15
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 3
            failureThreshold: 2
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 101                 # the image's nginx user
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
          volumeMounts:
            - {name: tmp, mountPath: /tmp} # nginx-unprivileged keeps its pid and temp files here
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 32Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels: {app: frontend}
spec:
  type: NodePort
  selector: {app: frontend}
  ports:
    - {name: http, port: 8080, targetPort: http, nodePort: 30080}
