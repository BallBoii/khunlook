# vector-db: read-only search over the index baked into the image. Stateless, so any replica on any Pi
# can serve any request and a replacement pod is identical as soon as it is ready.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vector-db
  labels: {app: vector-db}
spec:
  replicas: 1
  selector:
    matchLabels: {app: vector-db}
  template:
    metadata:
      labels: {app: vector-db}
    spec:
      affinity:
        podAntiAffinity:                   # spread replicas over Pis, but still schedule if Pis are down
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels: {app: vector-db}
      tolerations:                         # leave a dead/unplugged node after 20 s instead of 5 min
        - {key: node.kubernetes.io/unreachable, operator: Exists, effect: NoExecute, tolerationSeconds: 20}
        - {key: node.kubernetes.io/not-ready, operator: Exists, effect: NoExecute, tolerationSeconds: 20}
      containers:
        - name: vector-db
          image: ghcr.io/ballboii/khunlook-vector-db:latest   # tag set by deploy/k8s/kustomization.yaml
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8080}
          env:
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - {name: INDEX_DIR, value: /app/index}
            - {name: MAX_TOP_K, value: "20"}
            - {name: LOG_LEVEL, value: info}
          resources:
            requests: {cpu: 50m, memory: 64Mi}   # ~40 MiB runtime + ~10 MiB course index (27 MiB peak while loading)
            limits: {memory: 160Mi}
          startupProbe:                    # up to ~60 s for a slow Pi to import numpy + load the index (1.6 s on a laptop)
            httpGet: {path: /healthz, port: http}
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 3
            failureThreshold: 2
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: vector-db
  labels: {app: vector-db}
spec:
  type: ClusterIP
  selector: {app: vector-db}
  ports:
    - {name: http, port: 8080, targetPort: http}
