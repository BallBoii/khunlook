# LOCAL TESTING ONLY: runs on a laptop with Docker, never on the cluster.
#
#   frontend -> api-gateway -> rag-service -> vector-db + model-service -> OpenRouter
#
# Needs services/model/.env with a real OPENROUTER_API_KEY (copy .env.example). Questions cost a
# very small amount on OpenRouter.
#
#   make dev-up      then open http://localhost:8080/?demo
#   make dev-down
name: khunlook-dev

services:

  model-service:
    build:
      context: ../..
      dockerfile: services/model/Dockerfile
    env_file:
      - ../../services/model/.env
    expose:
      - "8080"
    networks:
      - khunlook-dev

  vector-db:
    container_name: vector-db
    build:
      context: ../..
      dockerfile: services/vector-db/Dockerfile
    expose:
      - "8080"
    networks:
      - khunlook-dev
  rag-service:
    build:
      context: ../..
      dockerfile: services/rag/Dockerfile
    environment:
      VECTOR_DB_URL: http://vector-db:8080
      MODEL_SERVICE_URL: http://model-service:8080
    depends_on: [vector-db, model-service]
    expose:
      - "8080"
    networks:
      - khunlook-dev

  api-gateway:
    build:
      context: ../..
      dockerfile: services/api-gateway/Dockerfile
      target: gateway
    deploy:
      replicas: 1              # two replicas, like the cluster, to see load balancing
    environment:
      RAG_URL: http://rag-service:8080
    depends_on: [rag-service]
    expose:
      - "8080"
    networks:
      - khunlook-dev

  frontend:
    build:
      context: ../..
      dockerfile: services/frontend/Dockerfile
    ports:
      - "8080:8080"
    depends_on: [api-gateway]
    networks:
      - khunlook-dev

networks:
  khunlook-dev:
    driver: bridge