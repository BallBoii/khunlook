# Eval questions -> index/query_fixtures.jsonl (embedded with the same model as the index).
# `expected` = documents that answer the question. For courses give only the doc_id (the course
# number): any chunk of that course counts. A hit = any expected doc in the top-k results.
# Questions with an empty `expected` are still embedded (rag-service can use them) but skipped by eval.
