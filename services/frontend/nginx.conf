# frontend nginx config: serves the chat page and forwards /api/* to the api-gateway Service.
#
# Installed as /etc/nginx/conf.d/default.conf in nginxinc/nginx-unprivileged, which listens on
# 8080, runs as a non-root user and keeps its temp files in /tmp (an emptyDir in the k8s manifest).
#
#   /healthz            -> "ok" (Kubernetes probes)
#   /api/...            -> api-gateway:8080 (same path)
#   fonts, logo         -> static, cached 7 days
#   everything else     -> the page (index.html), always revalidated

# The same Service is listed twice on purpose. Right after a Pi is pulled, Kubernetes still
# lists its gateway pod for ~40-50 s. If connecting fails, nginx tries the "second" server: a
# fresh connection, for which kube-proxy picks a gateway pod again, usually the live one.
# max_fails=0 stops nginx from marking the address as down (both entries are the same address).
upstream api_gateway {
    server api-gateway:8080 max_fails=0;
    server api-gateway:8080 max_fails=0;
}

server {
    listen 8080;
    server_tokens off;                        # don't advertise the nginx version
    root /usr/share/nginx/html;
    charset utf-8;

    gzip on;
    gzip_types text/css application/javascript application/json;

    # The pod name (= hostname in Kubernetes): first hop of the chain shown in demo mode.
    # add_header is not inherited by a location that sets its own headers, so it is repeated below.
    add_header X-Served-By $hostname always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://api_gateway;            # keeps the /api/... path
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;  # real client IP for rate limits; overwrites the browser's
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
        proxy_hide_header X-Served-By;            # the gateway reports itself in the body instead

        proxy_connect_timeout 2s;                 # a dead pod never answers: give up fast
        proxy_read_timeout 100s;                  # above the gateway's 90 s overall chat deadline
        proxy_next_upstream error timeout;        # retry only failed connects: nothing was sent yet
        proxy_next_upstream_tries 2;

        client_max_body_size 16k;                 # questions are small
        add_header X-Served-By $hostname always;
        add_header Cache-Control "no-store" always;
    }

    location ~* \.(?:woff2|svg|png)$ {
        expires 7d;
        add_header X-Served-By $hostname always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header X-Served-By $hostname always;
        add_header Cache-Control "no-cache" always;   # always check for a new version of the page
    }
}
