# Shared by the master VM and the Pis: kernel prep, containerd, kubelet/kubeadm/kubectl.
# Docker is NOT installed on the nodes: Kubernetes only needs containerd, and the Pi 3 B+ has 1 GB RAM.

- name: Set hostname to the inventory name
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"

- name: Turn swap off now
  ansible.builtin.command: swapoff -a
  when: ansible_facts['swaptotal_mb'] > 0
  changed_when: true

- name: Stop Raspberry Pi OS swap services from coming back
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: stopped
    enabled: false
  loop: [dphys-swapfile, rpi-zram-writeback]
  failed_when: false

- name: Comment out swap entries in fstab
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^([^#].*\sswap\s.*)$'
    replace: '# \1'

- name: Kernel modules for containerd and Kubernetes networking
  ansible.builtin.copy:
    dest: /etc/modules-load.d/k8s.conf
    content: |
      overlay
      br_netfilter
      vxlan
    mode: "0644"

- name: Load the modules now
  ansible.builtin.command: "modprobe {{ item }}"
  loop: [overlay, br_netfilter, vxlan]
  changed_when: false

- name: Sysctls for pod networking
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-k8s.conf
    content: |
      net.bridge.bridge-nf-call-iptables = 1
      net.bridge.bridge-nf-call-ip6tables = 1
      net.ipv4.ip_forward = 1
    mode: "0644"
  notify: Apply sysctls

- name: Base packages
  ansible.builtin.apt:
    name: [apt-transport-https, ca-certificates, curl, gpg, python3-debian, conntrack, socat, containerd]
    update_cache: true
    cache_valid_time: 3600

- name: Containerd config directory
  ansible.builtin.file:
    path: /etc/containerd
    state: directory
    mode: "0755"

- name: Does containerd already use systemd cgroups?
  ansible.builtin.command: grep -q 'SystemdCgroup = true' /etc/containerd/config.toml
  register: containerd_cfg
  failed_when: false
  changed_when: false

- name: Write containerd config with SystemdCgroup = true
  ansible.builtin.shell: >
    set -o pipefail &&
    containerd config default | sed 's/SystemdCgroup = false/SystemdCgroup = true/'
    > /etc/containerd/config.toml
  args:
    executable: /bin/bash
  when: containerd_cfg.rc != 0
  changed_when: true
  notify: Restart containerd

- name: Containerd running
  ansible.builtin.systemd_service:
    name: containerd
    state: started
    enabled: true

- name: Kubernetes apt repo
  ansible.builtin.deb822_repository:
    name: kubernetes
    types: deb
    uris: "https://pkgs.k8s.io/core:/stable:/{{ kube_minor }}/deb/"
    suites: /
    signed_by: "https://pkgs.k8s.io/core:/stable:/{{ kube_minor }}/deb/Release.key"
  register: k8s_repo

- name: Install kubelet, kubeadm, kubectl
  ansible.builtin.apt:
    name: [kubelet, kubeadm, kubectl]
    update_cache: "{{ k8s_repo.changed }}"

- name: Hold Kubernetes packages (upgrades must go through kubeadm)
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop: [kubelet, kubeadm, kubectl]

- name: Kubelet enabled
  ansible.builtin.systemd_service:
    name: kubelet
    enabled: true

- name: Apply handlers before kubeadm runs
  ansible.builtin.meta: flush_handlers
