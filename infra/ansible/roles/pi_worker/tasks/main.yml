- name: Require arm64
  ansible.builtin.assert:
    that: ansible_architecture == 'aarch64'

- name: Set hostname
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"

- name: Enable memory cgroups on kernel cmdline
  ansible.builtin.replace:
    path: "{{ cmdline }}"
    regexp: '^(?!.*cgroup_memory=1)(.*?)\s*$'
    replace: '\1 cgroup_enable=cpuset cgroup_memory=1 cgroup_enable=memory'
  register: cgroups

- name: Reboot if cmdline changed
  ansible.builtin.reboot:
  when: cgroups.changed

- name: Disable swap
  ansible.builtin.shell: |
    swapoff -a
    systemctl disable --now dphys-swapfile 2>/dev/null || true
    sed -i '/\sswap\s/s/^/#/' /etc/fstab
  when: ansible_swaptotal_mb > 0
  changed_when: true

- name: Kernel modules and sysctls
  ansible.builtin.shell: |
    printf 'overlay\nbr_netfilter\n' > /etc/modules-load.d/k8s.conf
    modprobe overlay && modprobe br_netfilter
    printf 'net.bridge.bridge-nf-call-iptables=1\nnet.ipv4.ip_forward=1\n' > /etc/sysctl.d/99-k8s.conf
    sysctl --system
  args:
    creates: /etc/sysctl.d/99-k8s.conf

- name: Kubernetes apt repo
  ansible.builtin.deb822_repository:
    name: kubernetes
    types: deb
    uris: "https://pkgs.k8s.io/core:/stable:/{{ kube_minor }}/deb/"
    suites: /
    signed_by: "https://pkgs.k8s.io/core:/stable:/{{ kube_minor }}/deb/Release.key"

- name: Install Docker (with buildx), containerd, kubelet, kubeadm
  ansible.builtin.apt:
    name: [docker.io, docker-buildx, containerd, kubelet, kubeadm, conntrack, socat, python3-debian]
    update_cache: true

- name: Check containerd uses systemd cgroups
  ansible.builtin.command: grep -q 'SystemdCgroup = true' /etc/containerd/config.toml
  register: containerd_cfg
  failed_when: false
  changed_when: false

- name: Configure containerd for kubelet
  ansible.builtin.shell: >
    containerd config default | sed 's/SystemdCgroup = false/SystemdCgroup = true/'
    > /etc/containerd/config.toml
  when: containerd_cfg.rc != 0
  changed_when: true
  notify: Restart containerd

- name: Let the SSH user run docker
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups: docker
    append: true

- name: Already joined?
  ansible.builtin.stat:
    path: /etc/kubernetes/kubelet.conf
  register: joined

- name: Create join command on the master
  ansible.builtin.command: kubeadm token create --ttl 30m --print-join-command
  delegate_to: "{{ groups['master'][0] }}"
  register: join_cmd
  changed_when: true
  when: not joined.stat.exists

- name: Join the cluster
  ansible.builtin.command: "{{ join_cmd.stdout }} --node-name {{ inventory_hostname }}"
  when: not joined.stat.exists
  changed_when: true
