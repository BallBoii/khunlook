# Edit IPs/users for your LAN. Inventory names become the Kubernetes node names (lowercase, unique).
# Give every host a DHCP reservation on the router so these IPs never change.

[master]
k8s-master ansible_host=192.168.0.10 ansible_user=ubuntu     # Ubuntu 24.04 arm64 VM in UTM (bridged)

[workers]
pi-worker-1 ansible_host=192.168.0.21
pi-worker-2 ansible_host=192.168.0.22
pi-worker-3 ansible_host=192.168.0.23
pi-worker-4 ansible_host=192.168.0.24
pi-worker-5 ansible_host=192.168.0.25

[workers:vars]
ansible_user=pi

[cluster:children]
master
workers
