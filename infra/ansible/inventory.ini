# Edit IPs/users for your LAN. Inventory names become the Kubernetes node names (lowercase, unique).
# Give every host a DHCP reservation on the router so these IPs never change.
# Run Ansible ON the master VM: it manages itself locally (ansible_connection=local, no SSH) and
# reaches the Pis over SSH. Keep ansible_host on the master: it is the API server address.

[master]
k8s-master ansible_host=172.31.207.100 ansible_user=ubuntu ansible_connection=local

[workers]
; pi-worker-1 ansible_host=192.168.0.103 ansible_user=pi
pi-worker-2 ansible_host=192.168.0.103 ansible_user=pi
pi-worker-3 ansible_host=192.168.0.104 ansible_user=pi
pi-worker-4 ansible_host=192.168.0.105 ansible_user=pi
; pi-worker-4 ansible_host=192.168.0.24
; pi-worker-5 ansible_host=192.168.0.25

[workers:vars]
ansible_user=pi

[cluster:children]
master
workers
