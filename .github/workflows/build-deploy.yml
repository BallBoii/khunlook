# CI half of the GitOps loop:
#
#   push to main ─► test ─► build changed services (linux/arm64) ─► push to GHCR as :<sha>
#                 ─► bump newTag in deploy/k8s/kustomization.yaml ─► commit to main
#   Argo CD (on the master VM) polls main every ~60 s and rolls the new tags out to the Pis.
#
# Pull requests only run the tests. "Run workflow" (workflow_dispatch) rebuilds every service.
# The bump commit is made with GITHUB_TOKEN, which never triggers another workflow run.
name: build-deploy

on:
  push:
    branches: [main]
    paths:
      - "services/**"
      - "index/**"
      - "ingest/**"
      - "Makefile"
      - ".github/workflows/build-deploy.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-deploy-${{ github.ref }}
  cancel-in-progress: false      # never drop a deploy half-way; queue instead

env:
  IMAGE_PREFIX: ghcr.io/ballboii/khunlook      # images: <prefix>-<service>; must match deploy/k8s

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      any: ${{ steps.matrix.outputs.any }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            frontend:      ["services/frontend/**"]
            api-gateway:   ["services/api-gateway/**"]
            rag:           ["services/rag/**"]
            vector-db:     ["services/vector-db/**", "index/**"]
            model-service: ["services/model/**"]
            workflow:      [".github/workflows/build-deploy.yml"]
      - name: Build matrix
        id: matrix
        env:
          CHANGED: ${{ steps.filter.outputs.changes }}
          EVENT: ${{ github.event_name }}
        run: |
          all='[
            {"service":"frontend",      "dockerfile":"services/frontend/Dockerfile",    "target":""},
            {"service":"api-gateway",   "dockerfile":"services/api-gateway/Dockerfile", "target":"gateway"},
            {"service":"rag",           "dockerfile":"services/rag/Dockerfile",         "target":""},
            {"service":"vector-db",     "dockerfile":"services/vector-db/Dockerfile",   "target":""},
            {"service":"model-service", "dockerfile":"services/model/Dockerfile",       "target":""}
          ]'
          # Manual runs and edits to this workflow rebuild everything.
          if [ "$EVENT" = "workflow_dispatch" ] || echo "$CHANGED" | jq -e 'index("workflow")' >/dev/null; then
            matrix=$(echo "$all" | jq -c '.')
          else
            matrix=$(echo "$all" | jq -c --argjson c "$CHANGED" '[.[] | select(.service as $s | $c | index($s))]')
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "any=$(echo "$matrix" | jq 'length > 0')" >> "$GITHUB_OUTPUT"
          echo "Services to build: $(echo "$matrix" | jq -r '[.[].service] | join(", ")')"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: make setup
      - run: make test

  build:
    needs: [changes, test]
    if: github.event_name != 'pull_request' && needs.changes.outputs.any == 'true'
    # Set the repository variable ARM_RUNNER=ubuntu-24.04-arm to build natively on arm64 (much
    # faster) if your plan has arm runners; otherwise arm64 is emulated with QEMU.
    runs-on: ${{ vars.ARM_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

  bump:
    needs: [changes, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Point deploy/k8s at the new images
        env:
          MATRIX: ${{ needs.changes.outputs.matrix }}
          TAG: ${{ github.sha }}
        run: |
          for svc in $(echo "$MATRIX" | jq -r '.[].service'); do
            IMG="$IMAGE_PREFIX-$svc" yq -i '(.images[] | select(.name == strenv(IMG))).newTag = strenv(TAG)' \
              deploy/k8s/kustomization.yaml
          done
          git diff --stat
      - name: Commit and push
        env:
          MATRIX: ${{ needs.changes.outputs.matrix }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/k8s/kustomization.yaml
          git diff --cached --quiet && { echo "Nothing to bump"; exit 0; }
          git commit -m "deploy: $(echo "$MATRIX" | jq -r '[.[].service] | join(", ")') -> ${GITHUB_SHA::7}"
          # Another push may have landed meanwhile: rebase and retry.
          for _ in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep 5; done
          exit 1
